<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="PoRepoLineTracker">
  <!-- Vector favicon: ~700 bytes against 3-4KB for the PNG it supersedes, and it stays crisp on
       every density and at every tab size instead of being resampled from a fixed 32px raster.
       favicon.png is retained in index.html as the fallback for engines that ignore image/svg+xml.

       The media query is the reason this is worth being SVG rather than an optimised PNG: a
       favicon is composited against the BROWSER's chrome, not the page, so a mark tuned for a
       light tab strip goes muddy on a dark one. An SVG favicon carries its own dark variant. -->
  <style>
    .bg { fill: #6750A4; }
    .fg { fill: #ffffff; }
    .accent { fill: #34d399; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #a78bfa; }
      .fg { fill: #0f172a; }
      .accent { fill: #059669; }
    }
  </style>
  <rect class="bg" width="32" height="32" rx="7"/>
  <!-- Angle brackets: the "code" glyph the header brand also uses. -->
  <path class="fg" d="M11.6 9.4 5.9 15.3a1 1 0 0 0 0 1.4l5.7 5.9 1.7-1.7-4.9-4.9 4.9-4.9zM20.4 9.4l-1.7 1.7 4.9 4.9-4.9 4.9 1.7 1.7 5.7-5.9a1 1 0 0 0 0-1.4z"/>
  <!-- Trend tick: the growth mark carried by the header and login logomark. -->
  <path class="accent" d="M13.2 19.1l2.6-3.4 2.1 1.9 3.1-4.4v3.1l-3.3 4.6-2.1-1.9-2.4 3.1z"/>
</svg>
