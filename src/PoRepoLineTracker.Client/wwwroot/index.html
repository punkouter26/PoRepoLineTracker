<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Track lines of code across all your GitHub repositories with PoRepoLineTracker." />
    <meta name="color-scheme" content="light dark" />
    <meta property="og:title" content="PoRepoLineTracker" />
    <meta property="og:description" content="Track lines of code across all your GitHub repositories." />
    <meta property="og:type" content="website" />
    <title>PoRepoLineTracker</title>
    <base href="/" />
    <link rel="manifest" href="manifest.json" />

    <!-- Both font stylesheets are render-blocking requests to a THIRD origin, so before a single
         byte of CSS arrives the browser must do DNS + TCP + TLS to fonts.googleapis.com, parse the
         returned @font-face rules, and then repeat the whole handshake for fonts.gstatic.com where
         the actual font binaries live. These two hints run the handshakes in parallel with the
         document parse instead of serially after it — worth ~200-400ms of first paint on a cold
         connection, for two lines and no build-system change.
         `crossorigin` on the gstatic hint is required, not optional: fonts are fetched in CORS
         mode, and a preconnect without it warms a connection in the wrong mode that the font
         request then cannot reuse. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link id="radzen-theme" rel="stylesheet" href="_content/Radzen.Blazor/css/material-base.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" />
    <link rel="stylesheet" href="css/app.css" />
    <!-- effects.css AFTER app.css: it redefines glass tokens per theme and layers motion
         utilities over the shell, so it must win on equal specificity. -->
    <link rel="stylesheet" href="css/effects.css" />

    <!-- SVG first, PNG second. Browsers pick the last icon they understand, so an engine without
         image/svg+xml support falls through to the raster without any scripting. -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="PoRepoLineTracker.Client.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_content/Radzen.Blazor/Radzen.Blazor.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        function clickGitHubButton() {
            const button = document.querySelector('button.btn-primary');
            if (button && button.textContent.includes('Select from GitHub')) {
                console.log('Attempting to click "Select from GitHub" button via JavaScript.');
                button.click();
            } else {
                console.log('Button "Select from GitHub" not found or text mismatch.');
            }
        }

        // Paint a theme without recording a choice. `data-theme` is what app.css keys
        // off, so it must be set on every path — previously it was only set when the
        // user actively toggled, which left the OS-dark case styled as light.
        function applyTheme(theme) {
            var link = document.getElementById('radzen-theme');
            if (link) {
                link.href = theme === 'dark'
                    ? '_content/Radzen.Blazor/css/material-dark.css'
                    : '_content/Radzen.Blazor/css/material-base.css';
            }
            document.documentElement.setAttribute('data-theme', theme);
        }

        // Explicit user choice: paint it and remember it.
        function setTheme(theme) {
            applyTheme(theme);
            localStorage.setItem('theme', theme);
        }

        function prefersDark() {
            return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        }

        // What the app is actually showing right now — MainLayout reads this to seed
        // its toggle so the icon cannot disagree with the page.
        function getEffectiveTheme() {
            return document.documentElement.getAttribute('data-theme') || 'light';
        }

        // getViewportWidth() removed: MainLayout now uses <RadzenMediaQuery>, which subscribes to
        // matchMedia and keeps tracking. The one-shot interop it replaced sampled the width once
        // on first render, so a rotate never updated the drawer's breakpoint state.

        // Resolve the theme before first paint: saved choice wins, else the OS
        // preference. Deliberately not persisted, so a user who has never chosen
        // keeps following their OS when it changes.
        (function () {
            var saved = localStorage.getItem('theme');
            applyTheme(saved || (prefersDark() ? 'dark' : 'light'));

            if (!saved && window.matchMedia) {
                window.matchMedia('(prefers-color-scheme: dark)')
                    .addEventListener('change', function (e) {
                        if (!localStorage.getItem('theme')) applyTheme(e.matches ? 'dark' : 'light');
                    });
            }
        })();
    </script>
</body>

</html>
