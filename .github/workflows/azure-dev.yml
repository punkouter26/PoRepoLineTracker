# Azure App Service deployment via Azure Developer CLI (azd)
# Triggered on push to master or manual dispatch
on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: azure-dev-master
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      APP_RESOURCE_GROUP: PoRepoLineTracker
      APP_SERVICE_NAME: app-porepolinetracker
      PUBLISH_OUTPUT_DIR: ${{ github.workspace }}/publish-output
      PUBLISH_PACKAGE_PATH: ${{ github.workspace }}/appservice-package.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Log in with Azure (Federated Credentials)
        run: |
          azd auth login `
            --client-id "$Env:AZURE_CLIENT_ID" `
            --federated-credential-provider "github" `
            --tenant-id "$Env:AZURE_TENANT_ID"
        shell: pwsh

      - name: Log in with Azure CLI (Federated Credentials)
        uses: azure/login@v1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Provision Infrastructure
        run: |
          # Provision Azure resources
          # Note: RoleAssignmentExists errors are safe to ignore per azd output - permissions are already in place
          # The Bicep template uses deterministic unique naming for idempotent deployments
          echo "Running azd provision..."
          if ! azd provision --no-prompt; then
            echo "Checking if failure is due to existing role assignment..."
            if azd provision --no-prompt 2>&1 | grep -q "RoleAssignmentExists"; then
              echo "Role assignment already exists - this is expected for re-provisioning. Continuing..."
            else
              exit 1
            fi
          fi

      - name: Restore dependencies
        run: dotnet restore ./PoRepoLineTracker.sln

      - name: Verify formatting
        run: dotnet format ./PoRepoLineTracker.sln --verify-no-changes --verbosity minimal

      - name: Run unit tests
        run: dotnet test ./tests/PoRepoLineTracker.UnitTests/PoRepoLineTracker.UnitTests.csproj --configuration Release --logger "trx;LogFileName=unit-tests.trx"

      - name: Run integration tests
        run: dotnet test ./tests/PoRepoLineTracker.IntegrationTests/PoRepoLineTracker.IntegrationTests.csproj --configuration Release --logger "trx;LogFileName=integration-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/*.trx"

      - name: Publish App Service package
        run: dotnet publish ./src/PoRepoLineTracker.Api/PoRepoLineTracker.Api.csproj --configuration Release --output "$PUBLISH_OUTPUT_DIR"

      - name: Make startup script executable
        run: chmod +x "$PUBLISH_OUTPUT_DIR/startup.sh"

      - name: Create deployment zip package
        shell: pwsh
        run: |
          if (Test-Path "$Env:PUBLISH_PACKAGE_PATH") {
            Remove-Item "$Env:PUBLISH_PACKAGE_PATH" -Force
          }

          Compress-Archive -Path "$Env:PUBLISH_OUTPUT_DIR/*" -DestinationPath "$Env:PUBLISH_PACKAGE_PATH"

      - name: Deploy published app to App Service
        run: az webapp deploy --resource-group "$APP_RESOURCE_GROUP" --name "$APP_SERVICE_NAME" --src-path "$PUBLISH_PACKAGE_PATH" --type zip --clean true --async true

      - name: Wait for deployment to land
        run: sleep 30

      - name: Set startup command (git installer) and restart app
        run: |
          az webapp config set \
            --name "$APP_SERVICE_NAME" \
            --resource-group "$APP_RESOURCE_GROUP" \
            --startup-file "bash /home/site/wwwroot/startup.sh"
          az webapp restart --name "$APP_SERVICE_NAME" --resource-group "$APP_RESOURCE_GROUP"

      - name: Verify deployed health endpoint
        shell: pwsh
        run: |
          $hostName = az webapp show `
            --name "$Env:APP_SERVICE_NAME" `
            --resource-group "$Env:APP_RESOURCE_GROUP" `
            --query defaultHostName `
            -o tsv

          if ([string]::IsNullOrWhiteSpace($hostName)) {
            throw "Unable to resolve App Service host name."
          }

          $healthUrl = "https://$hostName/health"

          for ($attempt = 1; $attempt -le 18; $attempt++) {
            try {
              $response = Invoke-WebRequest -Uri $healthUrl -UseBasicParsing -TimeoutSec 30
              Write-Host "Health response: $($response.Content)"

              if ($response.StatusCode -eq 200 -and ($response.Content -match '^Healthy$' -or $response.Content -match '"status"\s*:\s*"Healthy"')) {
                Write-Host "Health check passed on attempt $attempt" -ForegroundColor Green
                exit 0
              }
            }
            catch {
              Write-Host "Health check attempt $attempt failed: $($_.Exception.Message)" -ForegroundColor Yellow
            }

            if ($attempt -lt 18) {
              Start-Sleep -Seconds 10
            }
          }

          throw "Health endpoint did not report Healthy after deployment: $healthUrl"
        
