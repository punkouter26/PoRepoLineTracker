name: CI/CD — Build, Test & Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      deploy_infra:
        description: 'Apply infra/main.bicep (az deployment sub create) after build'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

env:
  DOTNET_VERSION: '10.0.x'
  AZURE_WEBAPP_NAME: app-porepolinetracker
  API_PROJECT_PATH: src/PoRepoLineTracker.Api/PoRepoLineTracker.Api.csproj
  UNIT_TEST_PATH: tests/PoRepoLineTracker.UnitTests

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: deploy-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Compile Bicep to ARM on every run — fast, needs no Azure login, and catches
  # template/type errors (and the kind of drift that broke prod) before merge.
  lint-infra:
    name: Lint Infra (Bicep)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: az bicep install
      - run: az bicep build --file infra/main.bicep --stdout > /dev/null
      - run: az bicep build --file infra/resources.bicep --stdout > /dev/null

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet format --verify-no-changes --verbosity minimal
      - run: dotnet test ${{ env.UNIT_TEST_PATH }} -c Release --no-build --logger trx --results-directory TestResults
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: TestResults/*.trx
      # Publish fresh every run. (Publish-output caching was removed: its key did not
      # hash *.cs, so pure C# changes hit the cache and shipped stale binaries.)
      - run: dotnet publish ${{ env.API_PROJECT_PATH }} -c Release --no-restore -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: publish
          retention-days: 1

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: webapp
          path: publish
      # OIDC federated identity — no client secrets stored in GitHub.
      # Federated credential subject: repo:punkouter26/PoRepoLineTracker:ref:refs/heads/master
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: cd publish && zip -r ../webapp.zip . && cd ..
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: webapp.zip
      # Smoke test the live site. /health must be 200; the home page must NOT be 5xx
      # (a 302 OAuth challenge is the expected unauthenticated response in Production).
      - name: Post-deploy smoke test
        run: |
          BASE="https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          sleep 20
          ok=""
          for i in 1 2 3 4 5; do
            HEALTH=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/health" --max-time 30 || echo 000)
            HOME=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/" --max-time 30 || echo 000)
            echo "Attempt $i: /health=$HEALTH  /=$HOME"
            if [ "$HEALTH" = "200" ] && [ "$HOME" != "000" ] && [ "${HOME:0:1}" != "5" ]; then
              ok=1; break
            fi
            sleep 15
          done
          if [ -z "$ok" ]; then
            echo "::error::Smoke test failed — /health not 200 or home page returned 5xx."
            exit 1
          fi
          echo "Deployment verified: /health healthy, home page non-5xx."

  # Apply infrastructure (resource group, app settings, role assignments) from Bicep.
  # Manual only: run the workflow via "Run workflow" with deploy_infra=true. This keeps
  # surprise infra changes out of routine code deploys while making provisioning repeatable.
  apply-infra:
    name: Apply Infra (manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_infra
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: What-if (preview changes)
        run: az deployment sub what-if --location eastus2 --template-file infra/main.bicep || true
      - name: Deploy
        run: az deployment sub create --location eastus2 --template-file infra/main.bicep
