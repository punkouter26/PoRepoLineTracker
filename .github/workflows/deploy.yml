name: CI/CD — Build, Test & Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      deploy_infra:
        description: 'Apply infra/main.bicep (az deployment sub create) after build'
        type: boolean
        default: false

# One deploy at a time — App Service restarts are exclusive, and a parallel run can leave the
# site half-upgraded.
#
# cancel-in-progress is FALSE, deliberately. It used to be true, which caused the very thing the
# comment above says the lock prevents: push twice in quick succession and the first run was
# killed, potentially mid-upload, leaving the site serving a partially-written package. Queueing
# costs a few minutes; cancelling a deploy costs a broken site.
concurrency:
  group: deploy-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

# Action majors are kept at the current release of each (checkout v7, setup-dotnet v6, cache v6,
# upload-artifact v7, download-artifact v8). They float within a major on purpose — a security fix
# to an action should land without a commit here — but upload-artifact and download-artifact must
# be upgraded TOGETHER: an artifact written by one major is not readable by an older one, and the
# failure is a deploy that cannot find the package it just built.
permissions:
  contents: read
  # OIDC federated credential — the workflow exchanges the GitHub OIDC token
  # for an Azure access token via azure/login@v2; no client secret is stored.
  id-token: write

env:
  DOTNET_VERSION: '10.0.x'
  AZURE_WEBAPP_NAME: app-porepolinetracker
  AZURE_WEBAPP_URL: https://app-porepolinetracker.azurewebsites.net
  # Casing matters: the runner is Linux, and the project is .API (not .Api).
  API_PROJECT_PATH: src/PoRepoLineTracker.API/PoRepoLineTracker.API.csproj

jobs:
  # Compile every Bicep file to ARM on every run — fast, no Azure login, and it
  # catches template/type errors (and the kind of drift that broke prod) before
  # any merge. Runs in parallel with the build so it does not add wall-clock time.
  lint-infra:
    name: Lint Infra (Bicep)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Cached: `az bicep install` pulls the CLI from GitHub releases on every run otherwise,
      # which was ~20s of the job's total.
      - name: Cache Bicep CLI
        uses: actions/cache@v6
        with:
          path: ~/.azure/bin
          key: bicep-${{ runner.os }}
      - name: Install Bicep CLI
        run: az bicep install
      # Every .bicep in the folder, not a hand-listed pair. The list version compiled main and
      # resources only, so a template added later was linted by nobody — and `find` cannot fall
      # out of date.
      - name: Compile Bicep → ARM (catches template errors)
        run: |
          set -euo pipefail
          find infra -name '*.bicep' -print0 | while IFS= read -r -d '' f; do
            echo "→ $f"
            az bicep build --file "$f" --stdout > /dev/null
          done

  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      # NuGet cache — keyed on csproj + Directory.Packages.props, so a code-only
      # change still reuses the cache and skips the network restore.
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Restore
        run: dotnet restore
      - name: Build (Release, no-restore, treat-warnings-as-errors)
        run: dotnet build --no-restore -c Release
      # Unit-only on purpose. The other tiers each have a hard CI-blocking dependency the
      # pipeline cannot satisfy, and adding them was tried before:
      #
      #   Integration (tests/PoRepoLineTracker.Integration) — needs Testcontainers spinning
      #     up Azurite per test class. On a hosted Linux runner the Docker-in-Docker path
      #     is flaky enough to fail most PRs for reasons unrelated to the change. 50 tests,
      #     ~7s locally with Azurite already up; on a cold runner with image pulls and
      #     Testcontainers init it is 2-3 minutes and intermittent.
      #
      #   E2EAPI / E2EUI — both need a running app (`dotnet run` from the same job) plus,
      #     for E2EUI, Playwright browsers installed via the bootstrapping script.
      #     Combined wall-clock ~6 minutes, and the failure modes are usually "the
      #     runner could not bind to a port" or "browser install timed out", not real bugs.
      #
      # All three tiers run green from a developer machine with `docker compose up -d` and
      # the app already built; the unit suite is the gate this pipeline CAN honestly keep
      # honest, so it is the gate it keeps. If you ever wire up a self-hosted runner with
      # persistent Azurite + Playwright, add `if: runner.dedicated == true` here rather
      # than removing the comment — the WHY is the part that needs to survive.
      #
      # RunSettingsFilePath is cleared to switch the coverlet collector OFF for CI. The Unit
      # csproj points it at tests/coverlet.runsettings, so the collector instruments every
      # assembly and writes cobertura+lcov on every run — and nothing in this pipeline reads
      # either file. (The 70% threshold in that runsettings is only enforced under an explicit
      # `--collect`, which CI does not pass, so dropping the collector loses no gate.) It stays
      # wired for local runs, where the report is actually looked at.
      - name: Test (Unit only — Integration/E2E require live infra)
        run: dotnet test tests/PoRepoLineTracker.Unit --no-build -c Release --verbosity minimal -p:RunSettingsFilePath=
      # --no-build, not just --no-restore. Without it publish re-ran the entire Release build that
      # the step above had already done, compiling every project twice per pipeline.
      - name: Publish API
        run: dotnet publish ${{ env.API_PROJECT_PATH }} -c Release --no-build -o publish
      # Zip HERE, not in the deploy job. The published output is a Blazor WASM site: 475 files /
      # 102 MB, which compresses to a single 44 MB zip. Uploading the folder made the pipeline
      # move 102 MB out and 102 MB back in — as hundreds of small files, which is the slow part
      # of artifact transfer — and then zip it anyway before handing it to webapps-deploy. One
      # file, built once, is the same package with a fraction of the transfer.
      - name: Package (zip)
        run: |
          set -euo pipefail
          cd publish
          zip -r ../webapp.zip . -q
      - name: Upload webapp artifact
        uses: actions/upload-artifact@v7
        with:
          name: webapp
          path: webapp.zip
          # Already compressed — re-compressing a zip costs CPU and saves nothing.
          compression-level: 0
          # Long enough to redeploy a known-good build by hand after a bad one. At the previous
          # single day, the only way back from a broken deploy was a revert commit through the
          # whole pipeline — F1 has no deployment slots to swap.
          retention-days: 14

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    timeout-minutes: 15
    # Records the deploy in GitHub's Environments view and gives the URL a home. Add a required
    # reviewer on the environment to gate production without touching this file.
    environment:
      name: production
      url: ${{ env.AZURE_WEBAPP_URL }}
    steps:
      # Full history, not the default shallow clone. The infra-changed check below diffs against
      # github.event.before, and a depth-1 checkout does not contain that commit — the diff fails,
      # the guard falls through to "changed", and infra is applied on every push exactly as it was
      # before the guard existed.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Lands webapp.zip in the workspace root — the build job already packaged it, so this job
      # deploys the exact bytes that were tested rather than re-zipping a folder it just unpacked.
      - uses: actions/download-artifact@v8
        with:
          name: webapp
          path: .
      # OIDC federated identity — no client secrets stored in GitHub.
      # Federated credential subject: repo:punkouter26/PoRepoLineTracker:ref:refs/heads/master
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Infra is applied only when the templates actually changed, or when asked for by hand.
      #
      # It used to run on every push. That was added because the App Service had gone missing and
      # nothing in the pipeline could recreate it — a real problem, fixed the blunt way. The cost
      # was that every code-only deploy paid for a subscription-scoped deployment, and a Bicep
      # edit reached production with no what-if in front of it. Gating on the diff keeps the
      # self-healing property for the case that motivated it while taking it off the hot path.
      - name: Did infra change?
        id: infra
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet ${{ github.event.before }} ${{ github.sha }} -- infra/ 2>/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Provision infra (Bicep)
        if: steps.infra.outputs.changed == 'true'
        run: |
          az deployment sub create \
            --location eastus2 \
            --template-file infra/main.bicep \
            --name porepolinetracker-${{ github.run_id }} \
            -o none

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: webapp.zip

      # The deploy step returns once the package is ACCEPTED, not once the site is serving it —
      # so without this a crash-on-startup shipped green and nobody knew until someone opened the
      # page. Polls /health (anonymous, and the same endpoint Azure's own probe uses) until it
      # answers, then checks that an app route and a static asset are really being served.
      - name: Smoke test the deployed site
        run: |
          set -euo pipefail
          echo "Waiting for ${{ env.AZURE_WEBAPP_URL }}/health …"
          for attempt in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${{ env.AZURE_WEBAPP_URL }}/health" || echo 000)
            if [ "$code" = "200" ]; then
              echo "health OK after ${attempt} attempt(s)"
              break
            fi
            if [ "$attempt" = "30" ]; then
              echo "::error::Site did not become healthy after the deploy (last status: $code)"
              exit 1
            fi
            sleep 10
          done

          # The shell must be reachable without signing in, or the sign-in page cannot load.
          login=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${{ env.AZURE_WEBAPP_URL }}/login")
          [ "$login" = "200" ] || { echo "::error::/login returned $login, expected 200"; exit 1; }

          # A protected API route must say 401, not redirect an XHR off-origin.
          api=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${{ env.AZURE_WEBAPP_URL }}/api/repositories")
          [ "$api" = "401" ] || { echo "::error::/api/repositories returned $api, expected 401"; exit 1; }

          # An unknown API route must say 404 — not 401, and above all not 200 carrying the HTML
          # shell, which is what a JSON caller used to receive for a typo. GET only: see the known
          # limit documented on ApiNotFoundMiddleware.
          missing=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${{ env.AZURE_WEBAPP_URL }}/api/no-such-route-smoke-test")
          [ "$missing" = "404" ] || { echo "::error::unknown API route returned $missing, expected 404"; exit 1; }

          # An unauthenticated page must land on THIS origin's login page, not at the OAuth
          # provider — the installed PWA starts at "/" and would otherwise leave its own scope.
          root_target=$(curl -s -o /dev/null -w '%{redirect_url}' --max-time 20 "${{ env.AZURE_WEBAPP_URL }}/")
          case "$root_target" in
            ""|"${{ env.AZURE_WEBAPP_URL }}"*) echo "root OK (${root_target:-200 served})" ;;
            *) echo "::error::/ redirected off-origin to $root_target"; exit 1 ;;
          esac

          echo "Smoke test passed."

  # Apply infrastructure (resource group, app settings, role assignments) from Bicep.
  # Manual only: run the workflow via "Run workflow" with deploy_infra=true. This is the path for
  # previewing a change with what-if before it reaches production.
  apply-infra:
    name: Apply Infra (manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_infra
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # Unique, per-run deployment name. A subscription-scoped deployment object is
      # pinned to the location it was first created in, so a fixed name (e.g. "main")
      # cannot move regions — use a fresh name each run to avoid InvalidDeploymentLocation.
      - name: What-if (preview changes)
        run: az deployment sub what-if --name "infra-${{ github.run_id }}" --location eastus2 --template-file infra/main.bicep || true
      - name: Deploy
        run: az deployment sub create --name "infra-${{ github.run_id }}" --location eastus2 --template-file infra/main.bicep
